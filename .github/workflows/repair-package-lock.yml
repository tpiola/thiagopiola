name: Repair package lock

on:
  push:
    branches: ["chore/ci-validation-baseline"]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ci-validation-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already consistent"
          else
            git commit -m "chore: atualiza package-lock para ESLint compatível"
            git push origin HEAD:chore/ci-validation-baseline
          fi
