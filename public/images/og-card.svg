    </text>
    <text x="0" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="400" fill="#7eb3e8" letter-spacing="4">
      CRF/SP 58.519
    </text>
    
    <line x1="0" y1="70" x2="200" y2="70" stroke="#2a6bb0" stroke-width="2" opacity="0.5"/>
    
    <text x="0" y="105" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="#ffffff" letter-spacing="1">
