    <path d="M 70 155 C 70 127, 92 105, 120 105 C 148 105, 170 127, 170 155 C 170 183, 148 205, 120 205 C 92 205, 70 183, 70 155 Z" stroke-width="7"/>
    <ellipse cx="120" cy="155" rx="50" ry="12" stroke-width="6"/>
    <rect x="114" y="205" width="12" height="28" rx="3" fill="#e8edf5"/>
    <path d="M 95 233 C 95 228, 106 224, 120 224 C 134 224, 145 228, 145 233 C 145 238, 134 242, 120 242 C 106 242, 95 238, 95 233 Z" fill="#e8edf5"/>
    
    <!-- Serpent -->
    <path d="M 70 155 C 40 145, 40 100, 70 90 C 100 80, 118 105, 105 135" stroke-width="6" stroke-linecap="round"/>
    <path d="M 170 155 C 200 145, 200 100, 170 90 C 140 80, 122 105, 135 135" stroke-width="6" stroke-linecap="round"/>
    <path d="M 90 95 C 80 75, 95 50, 120 50" stroke-width="6" stroke-linecap="round"/>
    <path d="M 150 95 C 160 75, 145 50, 120 50" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Head -->
    <path d="M 95 60 C 89 50, 93 38, 103 36 C 113 34, 123 40, 123 50 C 123 58, 117 70, 107 70 C 101 70, 97 67, 97 62" stroke-width="6" stroke-linecap="round"/>
    <circle cx="102" cy="56" r="2.5" fill="#e8edf5"/>
    <path d="M 92 52 C 88 50, 85 47, 87 44" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Text content -->
  <g transform="translate(450, 200)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#e8edf5" letter-spacing="2">
