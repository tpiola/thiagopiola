<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a30"/>
      <stop offset="50%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#0f2d50"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2a6bb0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2a6bb0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2a6bb0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  
  <!-- Subtle grid pattern -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="0.5">
