<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Simplified Bowl of Hygieia for favicon -->
  
  <!-- Bowl -->
  <path d="M 16 36 C 16 27, 23 20, 32 20 C 41 20, 48 27, 48 36 C 48 45, 41 52, 32 52 C 23 52, 16 45, 16 36 Z" stroke="currentColor" stroke-width="3" fill="none"/>
  <ellipse cx="32" cy="36" rx="16" ry="4" stroke="currentColor" stroke-width="2.5" fill="none"/>
  
  <!-- Bowl stem -->
  <rect x="30" y="52" width="4" height="8" rx="1.5" fill="currentColor"/>
  
  <!-- Bowl base -->
  <path d="M 24 60 C 24 58, 28 56, 32 56 C 36 56, 40 58, 40 60 C 40 62, 36 64, 32 64 C 28 64, 24 62, 24 60 Z" fill="currentColor"/>
  
  <!-- Serpent left -->
  <path d="M 16 36 C 6 30, 8 16, 18 12" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 48 36 C 58 30, 56 16, 46 12" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Serpent upper -->
  <path d="M 22 18 C 20 10, 26 4, 32 4" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 42 18 C 44 10, 38 4, 32 4" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Serpent head -->
  <path d="M 26 6 C 22 2, 18 4, 18 8 C 18 10, 20 12, 24 12 C 26 12, 28 10, 28 8 C 28 6, 27 5, 26 6 Z" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Eye -->
  <circle cx="23" cy="7" r="1.2" fill="currentColor"/>
</svg>
